# log4j (reload4j) dla serwerow CounterServer na klastrze DCC.
#
# Cel: policzyc ELEKCJE LIDERA podczas przebiegu 1MB. Hipoteza: przy TCP jedno duze
# AppendEntries (bufor appendera = 4MB) ucisza lacze do followera na 114-285 ms, bo
# heartbeat stoi w kolejce za wpisami w TYM SAMYM strumieniu bajtow. Okno elekcji to
# 150-300 ms, wiec follower rusza po glosy. QUIC ma heartbeat na osobnym strumieniu
# (TAG_HEARTBEAT), wiec nie stoi za niczym i elekcji nie powinno byc.
#
# UZYCIE: plik musi lezec w ~/log4j.properties na klastrze ($HOME jest wspolny dla
# wezlow, tak samo jak ~/ratis.jar), a JAVA nadpisane przy uruchomieniu:
#   JAVA="$HOME/jdk21/bin/java -Dlog4j.configuration=file:$HOME/log4j.properties"
# Serwery i tak przekierowuja stdout do server$i.log (run_lan.sh:399), a dump_logs
# (run_lan.sh:455) sciaga te pliki do katalogu wynikow - nic wiecej nie trzeba.
#
# rootLogger MUSI zostac na WARN. Wlaczenie INFO na calosci dolozy zapisy na wezle
# w trakcie pomiaru i bedziesz mierzyl juz inny system, nie ten sprzed zmiany.

log4j.rootLogger=WARN, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p %c{1} - %m%n

# Kandydat rusza po glosy: "... submit vote requests at term N ..." (LeaderElection:456).
# Przy zdrowym przebiegu nie pada ani razu, wiec narzut jest zerowy.
log4j.logger.org.apache.ratis.server.impl.LeaderElection=INFO

# Zmiany roli z terminem i powodem: "changes role from LEADER to FOLLOWER at term N for ..."
# (RaftServerImpl:396) - widac zdarzenie ze strony starego i nowego lidera naraz.
# Sprawdzone: pozostale LOG.info w tej klasie to start, shutdown, requestVote (tylko podczas
# elekcji) i galaz INCONSISTENCY - zadne nie bije w ustalonym ruchu.
# UWAGA (2026-09-09, HB-THREAD-CHANGES.md pkt 19): RaftServerImpl NIE ma wlasnego loggera - pisze
# przez RaftServer.Division.LOG, czyli logger "org.apache.ratis.server.RaftServer$Division"
# (RaftServer.java:63). Wpis dla ...impl.RaftServerImpl nigdy nie dzialal, dlatego linie
# "changes role" nie trafialy do logu, a kolumna elections byla zawsze 0. Zostaje jako dokumentacja.
log4j.logger.org.apache.ratis.server.impl.RaftServerImpl=INFO
log4j.logger.org.apache.ratis.server.RaftServer$Division=INFO
log4j.logger.org.apache.ratis.server.RaftServer=INFO

# NIE wlaczaj FollowerState na TRACE - linia :82 loguje KAZDY przychodzacy RPC.
# Uklad strumieni serwer-serwer (QuicRpcService loguje go raz przy starcie: "server-to-server
# stream layout: single stream" / "one stream per message type") - dowod w server*.log, ze
# wariant QUIC_SINGLE_STREAM=1 (--single-stream) faktycznie zadzialal. Kilka linii INFO na start.
log4j.logger.org.apache.ratis.quic.QuicRpcService=INFO
