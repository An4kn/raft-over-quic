# Peer addresses using Docker Compose service names (bridge network DNS).
# This file is mounted at /conf/conf-docker.properties inside each container
# and pointed to by the RATIS_EXAMPLE_CONF environment variable so that
# Constants.java picks it up instead of the default conf.properties that
# has hardcoded 127.0.0.1 addresses.
raft.server.address.list=n0:10024,n1:10124,n2:11124
